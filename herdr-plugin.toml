id = "local.stack"
name = "Stack"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Zellij-style stacked panes: the focused pane expands, its siblings collapse to strips"
platforms = ["linux", "macos"]


[[events]]
on = "pane.focused"
command = ["python3", "stack.py"]


[[actions]]
id = "toggle"
title = "Toggle stacking for this tab"
contexts = ["pane"]
command = ["python3", "stack.py", "toggle"]
